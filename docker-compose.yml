      #context: .
      #dockerfile: Dockerfile.dev
    #command: bundle exec sidekiq
    #volumes:
      #- .:/app
      #- bundle_data:/usr/local/bundle
      #- node_modules:/app/node_modules
    #depends_on:
      #- db
